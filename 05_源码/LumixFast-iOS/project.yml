 name: LumixFast
 options:
   bundleIdPrefix: com.lumixfast
   deploymentTarget:
     iOS: "17.0"
   developmentRegion: zh-Hans
   knownRegions:
     - zh-Hans
     - en
   createIntermediateGroups: true
   generateEmptySchemes: false
 settings:
   base:
     SWIFT_VERSION: "5.9"
     IPHONEOS_DEPLOYMENT_TARGET: "17.0"
     ENABLE_USER_SCRIPT_SANDBOXING: YES
     CODE_SIGN_STYLE: Automatic
 targets:
   LumixFast:
     type: application
     platform: iOS
     sources:
       - path: LumixFast/App
       - path: LumixFast/Model
       - path: LumixFast/Views
       - path: LumixFast/Resources
         excludes:
           - "Info.plist"
     settings:
       base:
         PRODUCT_BUNDLE_IDENTIFIER: com.lumixfast.ios
         INFOPLIST_FILE: LumixFast/Resources/Info.plist
         GENERATE_INFOPLIST_FILE: NO
         TARGETED_DEVICE_FAMILY: "1,2"
         ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
         ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
         CURRENT_PROJECT_VERSION: 1
         MARKETING_VERSION: "1.0.0"
         LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
         SUPPORTS_MACCATALYST: NO
         ENABLE_PREVIEWS: YES
